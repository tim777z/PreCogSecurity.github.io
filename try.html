<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try PreCog Security Free</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; }
        .container { max-width: 600px; margin: 80px auto; padding: 40px; background: white; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a1a2e; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .btn { width: 100%; background: #e94560; color: white; padding: 14px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #c73e54; }
        .features { margin: 30px 0; }
        .feature { display: flex; align-items: center; margin-bottom: 15px; }
        .check { color: #e94560; margin-right: 10px; font-size: 20px; }
        .footer { text-align: center; margin-top: 20px; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Scan Your Code Free</h1>
        <p class="subtitle">5 free security scans per month. No credit card required.</p>
        
        <div class="features">
            <div class="feature"><span class="check">✓</span> Security vulnerability detection</div>
            <div class="feature"><span class="check">✓</span> Secret leak scanning</div>
            <div class="feature"><span class="check">✓</span> Dependency analysis</div>
            <div class="feature"><span class="check">✓</span> Security score & report</div>
            <div class="feature"><span class="check">✓</span> AI-powered remediation tips</div>
        </div>
        
        <form action="https://formsubmit.co/timlangeveldt@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="PreCog Security - Free Account Request">
            <input type="hidden" name="_captcha" value="false">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="github">GitHub Username (optional)</label>
                <input type="text" id="github" name="github" placeholder="your-username">
            </div>
            <button type="submit" class="btn">Get Free Access</button>
        </form>
        
        <p class="footer">We'll send you API access within 24 hours.</p>
    </div>
</body>
</html>
